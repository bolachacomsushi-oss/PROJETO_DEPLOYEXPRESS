<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - Vintage Patty</title>
    <link rel="stylesheet" href="styleprodutos2.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">VINTAGE PATTY</a>
        <a href="CARDAPIO.HTML" class="goback">Voltar ao cardápio</a>
    </header>

    <main class="detalhes">

        <img id="imagem" src="imagens/back-to-80s.jpg" alt="Produto">

        <section class="informacoes">
            <h2 id="nome">Back to 80's</h2>

            <p id="descricao">
                Um clássico para viajar no tempo!
            </p>

            <h3 id="preco">R$ 25,90</h3>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" value="1" min="1">

            <label for="observacao">Observações:</label>
            <textarea id="observacao" placeholder="Ex.: sem cebola..."></textarea>

            <button type="button" onclick="adicionarPedido()">
                Adicionar ao pedido
            </button>
        </section>

    </main>

    <script src="produtos.js"></script>
</body>
</html>
